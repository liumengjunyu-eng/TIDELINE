; TIDELINE export presets — Windows Desktop + Web
; 通用 4.2+/4.3/4.4：只要在本机安装了对应导出模板即可一键导出。
; 若 Godot 提示某个选项键不存在，直接忽略或在编辑器「项目 → 导出」里重设即可。

[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/win/TIDELINE.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_safe_static=false
cs_unsafe=false
cs_explicit=false
dotnet/embed_assemblies_in_pck=true
dotnet/embed_debug_symbols_in_pck=true
dotnet/grant_linux_permissions=false
; 控制台可见：测试阶段保留，方便看 telemetry 与 [SELF-CHECK] 输出
debug/export_console=true
debug/console_wrapper=true
windows/embed_pck=true
windows/exe_version="1.0.0.0"
windows/exe_product_name="TIDELINE"
windows/file_version="1.0.0.0"
windows/info_version="1.0.0.0"
windows/info_product_name="TIDELINE"
windows/info_company_name="TIDELINE"
codesign/enable=false
application/icon=""
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name="TIDELINE"
application/product_name="TIDELINE"

[preset.1]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_safe_static=false
cs_unsafe=false
cs_explicit=false
dotnet/embed_assemblies_in_pck=true
dotnet/embed_debug_symbols_in_pck=true
dotnet/grant_linux_permissions=false
html/export_type="Regular"
html/export_executable_type="Embedded"
html/head_include=""
html/canvas_resize_policy=2
html/experimental_virtual_keyboard=false
web/export_lib_with_separate_wasm_file=true
web/use_threads=false
progressive_web_app/enabled=false
